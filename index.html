<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logística - Gestão de Pausas V3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Barra Lateral - Importação e Nomes */
        .sidebar { width: 300px; background: #1e1e1e; border-right: 2px solid #ff9800; display: flex; flex-direction: column; padding: 15px; }
        .sidebar h2 { color: #ff9800; font-size: 1.2em; text-align: center; }
        #lista-disponiveis { flex-grow: 1; overflow-y: auto; background: #252525; border-radius: 8px; padding: 10px; margin-top: 10px; border: 1px dashed #555; }
        
        .funcionario-item { background: #333; margin: 5px 0; padding: 10px; border-radius: 5px; cursor: grab; border-left: 4px solid #2196F3; font-weight: bold; font-size: 0.9em; transition: 0.2s; }
        .funcionario-item:active { cursor: grabbing; opacity: 0.5; }

        /* Painel Principal */
        .main-content { flex-grow: 1; padding: 20px; overflow-y: auto; text-align: center; }
        .container { max-width: 900px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 15px; border: 2px solid #ff9800; position: relative; }
        
        #clock { font-size: 2.5em; font-weight: bold; color: #00e676; margin-bottom: 10px; }
        .mascote-container { height: 100px; display: flex; justify-content: center; align-items: center; }
        .boneco { font-size: 60px; transition: 0.3s; }
        
        .status-card { background: #333; padding: 15px; border-radius: 10px; margin: 15px 0; border-left: 10px solid #ff9800; }
        .nomes-ativos { font-size: 1.4em; color: #ffeb3b; font-weight: 900; text-transform: uppercase; min-height: 40px; }

        /* Tabela de Horários - Áreas de Drop */
        .grid-horarios { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .slot-horario { background: #252525; border: 1px solid #444; border-radius: 8px; padding: 10px; text-align: left; min-height: 80px; transition: 0.3s; }
        .slot-horario.drag-over { border: 2px solid #00e676; background: #2e3d2e; }
        .slot-header { font-weight: bold; color: #ff9800; border-bottom: 1px solid #444; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .slot-nomes { font-size: 0.85em; color: #fff; min-height: 30px; }
        
        /* Tags de nomes dentro do horário */
        .nome-tag { background: #444; display: inline-block; padding: 2px 8px; border-radius: 4px; margin: 2px; font-size: 0.9em; border: 1px solid #666; }

        .btn-acao { background: #ff9800; color: #000; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 10px; width: 100%; }
        .btn-teste { background: #d32f2f; color: #fff; width: auto; margin-left: 10px; }

        /* Overlay Inicial */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        @keyframes shake { 0% { transform: translate(1px, 1px); } 20% { transform: translate(-3px, 0px); } 100% { transform: translate(1px, -1px); } }
        .alert-mode { animation: shake 0.5s infinite; color: #f44336; }
    </style>
</head>
<body>

<div id="overlay">
    <h1>Controle Logístico - Café</h1>
    <button class="btn-acao" style="width: 300px; height: 80px; font-size: 1.5em;" onclick="iniciarApp()">ATIVAR SISTEMA</button>
</div>

<div class="sidebar">
    <h2>Funcionários</h2>
    <input type="file" id="inputExcel" accept=".xlsx, .xls" style="display: none;" onchange="importarExcel(event)">
    <button class="btn-acao" onclick="document.getElementById('inputExcel').click()">📂 Importar Excel (.xlsx)</button>
    <div id="lista-disponiveis" ondrop="dropNoPool(event)" ondragover="allowDrop(event)">
        <p style="color: #666; text-align: center; font-size: 0.8em;">Importe a lista ou arraste nomes de volta para cá</p>
    </div>
</div>

<div class="main-content">
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div id="clock">00:00:00</div>
            <button class="btn-acao btn-teste" onclick="testarAlerta()">🚨 TESTAR ALARME</button>
        </div>

        <div class="mascote-container">
            <div id="boneco" class="boneco">📦</div>
        </div>

        <div class="status-card">
            <div id="status-label" style="color: #bbb; font-size: 0.9em;">AGORA NO CAFÉ:</div>
            <div id="grupo-nome" class="nomes-ativos">NENHUMA EQUIPE</div>
            <div id="aviso-saida" style="color: #f44336; font-weight: bold; display: none; font-size: 1.5em; margin-top: 10px;">⚠️ TEMPO ESGOTADO! SE RETIRE! ⚠️</div>
        </div>

        <div class="grid-horarios" id="grid-horarios">
            </div>
    </div>
</div>

<script>
    let audioCtx;
    let ultimaFala = "";
    const horariosFixos = ["02:00", "02:10", "02:20", "02:30", "02:40", "02:50", "03:00", "03:10", "03:20", "03:30"];
    let dadosEscala = {}; // { "02:00": ["Nome 1", "Nome 2"] }

    function iniciarApp() {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        document.getElementById('overlay').style.display = 'none';
        gerarGrid();
        setInterval(atualizarLogica, 1000);
    }

    function gerarGrid() {
        const grid = document.getElementById('grid-horarios');
        grid.innerHTML = '';
        horariosFixos.forEach(h => {
            dadosEscala[h] = [];
            grid.innerHTML += `
                <div class="slot-horario" ondrop="dropNoHorario(event, '${h}')" ondragover="allowDrop(event)">
                    <div class="slot-header"><span>🕒 ${h}</span></div>
                    <div class="slot-nomes" id="slot-${h}"></div>
                </div>
            `;
        });
    }

    // --- LOGICA DE DRAG AND DROP ---
    function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
    
    // Quando sai de cima da área de drop
    document.addEventListener("dragleave", function(ev) {
        if (ev.target.classList) ev.target.classList.remove('drag-over');
    });

    function drag(ev) {
        ev.dataTransfer.setData("nome", ev.target.innerText);
        ev.dataTransfer.setData("origemId", ev.target.id);
        // Se estiver saindo de um horário, removemos da lista
        const pai = ev.target.parentElement;
        if(pai.id.startsWith('slot-')) {
            const h = pai.id.replace('slot-', '');
            ev.dataTransfer.setData("horaOrigem", h);
        }
    }

    function dropNoHorario(ev, hora) {
        ev.preventDefault();
        ev.currentTarget.classList.remove('drag-over');
        const nome = ev.dataTransfer.getData("nome");
        const horaOrigem = ev.dataTransfer.getData("horaOrigem");

        // Remove da origem se veio de outro horário
        if (horaOrigem) {
            dadosEscala[horaOrigem] = dadosEscala[horaOrigem].filter(n => n !== nome);
            renderizarSlot(horaOrigem);
        } else {
            // Se veio do pool lateral, remove de lá
            const idOrigem = ev.dataTransfer.getData("origemId");
            const el = document.getElementById(idOrigem);
            if (el) el.remove();
        }

        if (!dadosEscala[hora].includes(nome)) {
            dadosEscala[hora].push(nome);
            renderizarSlot(hora);
        }
    }

    function dropNoPool(ev) {
        ev.preventDefault();
        ev.currentTarget.classList.remove('drag-over');
        const nome = ev.dataTransfer.getData("nome");
        const horaOrigem = ev.dataTransfer.getData("horaOrigem");

        if (horaOrigem) {
            dadosEscala[horaOrigem] = dadosEscala[horaOrigem].filter(n => n !== nome);
            renderizarSlot(horaOrigem);
            adicionarAoPool(nome);
        }
    }

    function renderizarSlot(h) {
        const container = document.getElementById(`slot-${h}`);
        container.innerHTML = dadosEscala[h].map(n => `<span class="nome-tag" draggable="true" ondragstart="drag(event)" id="tag-${Math.random()}">${n}</span>`).join('');
    }

    function adicionarAoPool(nome) {
        const pool = document.getElementById('lista-disponiveis');
        const div = document.createElement('div');
        div.className = 'funcionario-item';
        div.draggable = true;
        div.id = 'func-' + Math.random();
        div.innerText = nome;
        div.ondragstart = drag;
        pool.appendChild(div);
    }

    // --- IMPORTAÇÃO EXCEL ---
    function importarExcel(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const nomePlanilha = workbook.SheetNames[0];
            const planilha = workbook.Sheets[nomePlanilha];
            const json = XLSX.utils.sheet_to_json(planilha, {header: 1});
            
            document.getElementById('lista-disponiveis').innerHTML = '';
            json.forEach(linha => {
                if(linha[0]) adicionarAoPool(linha[0]);
            });
        };
        reader.readAsArrayBuffer(file);
    }

    // --- ALERTAS E VOZ ---
    function falar(texto) {
        if (ultimaFala === texto) return;
        ultimaFala = texto;
        const msg = new SpeechSynthesisUtterance(texto);
        msg.lang = 'pt-BR';
        window.speechSynthesis.speak(msg);
    }

    function tocarSirene() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 1);
    }

    function testarAlerta() {
        tocarSirene();
        falar("Teste de áudio do sistema de café");
    }

    function atualizarLogica() {
        const agora = new Date();
        const tempoH = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');
        document.getElementById('clock').innerText = agora.toLocaleTimeString();

        let alguemNoCafe = false;
        const boneco = document.getElementById('boneco');
        const aviso = document.getElementById('aviso-saida');

        horariosFixos.forEach((h, index) => {
            const [hora, min] = h.split(':').map(Number);
            const inicio = hora * 60 + min;
            const fim = inicio + 10;
            const agoraMinutos = agora.getHours() * 60 + agora.getMinutes();
            const slotEl = document.getElementById(`slot-${h}`).parentElement;

            if (agoraMinutos >= inicio && agoraMinutos < fim) {
                alguemNoCafe = true;
                slotEl.classList.add('active-row');
                const nomes = dadosEscala[h].join(', ') || "EQUIPE NÃO DEFINIDA";
                document.getElementById('grupo-nome').innerText = nomes;

                if (agoraMinutos === fim - 1) { // Último minuto
                    aviso.style.display = "block";
                    boneco.innerText = "🙅‍♂️";
                    boneco.classList.add('alert-mode');
                    if (agora.getSeconds() % 10 === 0) {
                        tocarSirene();
                        falar(`Equipe das ${h} acabou seu tempo por favor se retira`);
                    }
                } else if (agoraMinutos === inicio && agora.getSeconds() < 15) {
                    boneco.innerText = "🚶‍♂️➡️☕";
                    boneco.classList.remove('alert-mode');
                    aviso.style.display = "none";
                } else {
                    boneco.innerText = "☕";
                    boneco.classList.remove('alert-mode');
                    aviso.style.display = "none";
                }
            } else {
                slotEl.classList.remove('active-row');
            }
        });

        if (!alguemNoCafe) {
            document.getElementById('grupo-nome').innerText = "NENHUMA EQUIPE NO CAFÉ";
            boneco.innerText = "📦";
            aviso.style.display = "none";
            boneco.classList.remove('alert-mode');
            ultimaFala = "";
        }
    }
</script>

</body>
</html>
